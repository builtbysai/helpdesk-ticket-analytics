[project]
name = "helpdesk-ticket-analytics"
version = "0.1.0"
description = "Turns a helpdesk ticket export (CSV) into SLA, resolution-time, and volume metrics, with an HTML report."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
ticket-analytics = "ticket_analytics.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
